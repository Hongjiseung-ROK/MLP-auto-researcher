# Ralphthon local demonstration: two connected Auto Research iterations over
# a deterministic synthetic fixture. Non-claim-bearing by construction —
# no frozen test data, no hidden labels, no Cu partitions, no remote compute.
# The acceptance metric and thresholds are explicitly synthetic and are NOT
# an H2 preregistration.
schema_version: "1.0.0"

objective:
  schema_version: "1.0.0"
  objective_id: ralphthon-local-demo
  title: Locally verify the bounded Auto Research loop on a synthetic fixture
  research_question: >-
    Can the Auto Research controller propose a bounded fine-tuning
    configuration mutation, pause for Tea Time, validate legality, execute a
    deterministic fixture, accept or reject on an independent evaluation,
    record a lesson, and generate a second proposal that depends on the first
    outcome?
  domain: research-infrastructure
  benchmark_adapter: synthetic_quadratic_finetune_fixture/1.0.0
  success_criteria:
    - criterion_id: reduce-synthetic-loss
      metric: synthetic_validation_loss
      direction: minimize
      description: >-
        The synthetic validation loss decreases by at least the acceptance
        policy's minimum relative improvement.
  budget:
    max_compute_seconds: 600.0
    max_retries_per_iteration: 1
    max_labels: 0
    max_remote_jobs: 0
  maximum_iterations: 2
  protected_constants:
    - key: dataset_content_sha256
      value: bc9b78ca5e3b95f91bf34bbc3641a3d6e3f92338b4e3d97065165157848cfc48
      reason: H1-approved Cu dataset content hash; the loop must never touch it.
    - key: split_manifest_sha256
      value: 80d9b95083ebba9d8f988a461525b326ba807c79da834b066d1917afc9d8a15e
      reason: Whole-family split manifest; partition membership is frozen.
    - key: primary_endpoint
      value: force_mae_ev_per_angstrom_on_frozen_test
      reason: Preregistered Phase 2 endpoint; only H2 can change it.
  allowed_mutation_classes:
    - bounded_mutable
  required_evaluator: synthetic_aggregate_evaluator/1.0.0
  stopping_rules:
    - rule_id: max-iterations
      description: Stop after maximum_iterations connected iterations.
    - rule_id: budget-exhaustion
      description: Stop with PARTIAL when the simulated compute budget is exhausted.
    - rule_id: escalation
      description: Stop with BLOCKED when a decision escalates to the owner.
  approval_requirements: []
  scientific_status_ceiling: non_scientific
  created_by: ralphthon-controller-demo

mutation_policy_path: configs/research/ralphthon_mutation_policy.yaml

# Base bounded fine-tuning configuration for the fixture (synthetic).
base_config:
  learning_rate: 0.02
  gradient_clip: 1.0
  batch_size: 8
  scheduler_patience: 5
  force_loss_weight: 10.0
  energy_loss_weight: 1.0
  trainable_layer_policy: readout_only

fixture_seed: 20260712
output_root: artifacts/auto_research

# Synthetic acceptance thresholds (demo-only, not preregistration).
acceptance:
  primary_metric: synthetic_validation_loss
  minimize: true
  min_relative_improvement: 0.05
  tail_metric: synthetic_p95_residual
  tail_max: 2.0
  runtime_max_seconds: 60.0
  memory_max_mb: 1024.0
  reproducibility_max_delta: 1.0e-12
