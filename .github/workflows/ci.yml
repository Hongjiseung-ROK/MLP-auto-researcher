# CPU-only CI: the default pytest expression already deselects the opt-in
# colab_remote/vessl_remote markers, and real-model fixtures skip without
# MACE_TEST_CHECKPOINT. GPU-class execution never runs here — it goes through
# the owner-gated colab CLI driver (scripts/colab/colab_cli_run.sh) under the
# bounds recorded in docs/PHASE2_OPEN_QUESTIONS.md.
#
# Jobs are independent so one gate's failure cannot suppress another
# (the Phase 2 merge shipped with a mypy failure that masked every later
# step, including the secret scanner). Nothing here downloads checkpoints,
# datasets, or starts Colab/VESSL sessions.
name: CI

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check .

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Strict typing (mypy)
        run: python -m mypy src

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Tests (mock/CPU suite)
        run: python -m pytest

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Secret and large-file scan (tracked files)
        run: python scripts/check_staged.py --tracked

  whitespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Whitespace hygiene
        run: git diff --check
