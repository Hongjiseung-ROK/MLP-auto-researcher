[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlip-research-agent"
version = "0.1.0"
description = "Autonomous active-learning scientist for ML interatomic potentials (bootstrap vertical slice)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "ase>=3.23,<4",
    "pydantic>=2.6,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
mlip-agent = "mlip_research_agent.cli:main"

[project.optional-dependencies]
# LLM-driven planning/triage. Provider choice pending approval (docs/OPEN_QUESTIONS.md).
agent = []
# Extended atomistics beyond the bootstrap ASE core.
atomistics = ["pymatgen>=2024.1", "scikit-learn>=1.4", "scipy>=1.11"]
# MLIP backends: separate extras because their torch/e3nn pins can conflict.
# Install at most one per environment until per-backend isolation lands.
# mace is pinned exactly: evidence runs record the resolved environment, and
# MACE defaults can change between releases (docs/PHASE2_DECISIONS.md D-P2-8).
mace = ["mace-torch==0.3.16"]
# Materials Project reconnaissance/metadata access (D-P2-2, D-P2-7).
# Pinned exactly; the API key lives only in the gitignored api.env.
materials-project = ["mp-api==0.46.4", "python-dotenv==1.2.2"]
sevennet = ["sevenn>=0.10"]
orb = ["orb-models>=0.4"]
# DeepMD is likewise an MLIP backend extra; never co-install with mace/orb/sevennet.
deepmd = ["deepmd-kit>=2.2"]
# External adapter tools (adapters fail closed when these are absent).
dpdata = ["dpdata>=0.2.18"]
phonopy = ["phonopy>=2.20"]
rdkit = ["rdkit>=2023.9"]
# DFT: real backends are external licensed binaries (see DEPENDENCIES.md §10);
# this group holds Python-side wrappers only. Empty until the backend is approved.
dft = []
tracking = ["mlflow>=2.14", "dvc>=3.50"]
provenance = ["rocrate>=0.10", "prov>=2.0"]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    # The materials_project skill's mock tests exercise the real api.env parsing
    # path; pinned identically to the materials-project extra to avoid skew.
    "python-dotenv==1.2.2",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
# 'all' deliberately excludes the mutually incompatible MLIP backend extras
# and is never installed by default.
all = [
    "mlip-research-agent[atomistics,tracking,provenance,dev,docs]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["third_party/ralphthon-icml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"

# Optional third-party backends: imports are runtime-guarded behind extras, so
# these modules are legitimately absent in the default (CI) environment. dotenv
# ships with the materials-project extra only (secrets/api_env.py guards it).
[[tool.mypy.overrides]]
module = [
    "ase.*", "torch", "torch.*", "mp_api.*", "pymatgen.*", "emmet.*", "mace.*", "e3nn.*",
    "dpdata.*", "phonopy.*", "rdkit.*", "deepmd.*", "dotenv",
]
ignore_missing_imports = true

# ASE ships partial annotations; calls into its untyped surface are expected
# in the modules that wrap it.
[[tool.mypy.overrides]]
module = [
    "mlip_research_agent.skills.atomistics.*",
    "mlip_research_agent.skills.dft.*",
    "mlip_research_agent.skills.mlip.mace_inference.*",
    "mlip_research_agent.skills.external_adapters.*",
]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
# Remote-resource tests are opt-in: run with `pytest -m colab_remote` etc.
# (a later -m on the command line overrides this default deselection).
addopts = "-q -m \"not colab_remote and not vessl_remote\""
markers = [
    "colab_remote: opt-in tests that consume real Colab resources (skipped without credentials)",
    "vessl_remote: opt-in tests that consume real VESSL resources (skipped without credentials)",
]
